apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-train-dev-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hjin-2e/Train_repo.git
    targetRevision: HEAD
    path: modules/infra/k8s-manifests/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
