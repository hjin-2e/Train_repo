apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: train-config
    envs:
      - backend-config.env

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: team-train-dev-backend
    newName: 889951087651.dkr.ecr.ap-northeast-2.amazonaws.com/team-train-prod-backend
    newTag: latest

patchesStrategicMerge:
  - targetgroupbinding-patch.yaml
