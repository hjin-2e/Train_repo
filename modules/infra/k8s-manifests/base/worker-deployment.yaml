# 뒷부분 DB 적재 Worker (3~5대 고정)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-db-worker
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: train-worker
  template:
    metadata:
      labels:
        app: train-worker
    spec:
      serviceAccountName: booking-sa
      containers:
      - name: worker-container
        # TODO: terraform apply 후 실제 ECR 주소로 교체하세요.
        # 형식: <ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/train-worker:latest
        # GitOps CI가 업데이트하려면 backend-ci.yml의 kustomize edit set image 라인에 train-worker를 추가하세요.
        image: 889951087651.dkr.ecr.ap-northeast-2.amazonaws.com/team-train-dev-worker:latest
        envFrom:
        - configMapRef:
            name: train-config
        - secretRef:
            name: train-secret
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits: 
            cpu: "500m"
            memory: "512Mi"