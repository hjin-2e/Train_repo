apiVersion: v1
kind: Service
metadata:
  name: train-backend-service  # ingress.yaml이 참조하는 이름과 일치
  namespace: default
  labels:
    app: train-backend
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: train-backend  # backend-deployment.yaml의 라벨과 일치
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: backend-targetgroup-binding
  namespace: default
spec:
  targetType: ip
  # ⚠️ 이 값은 Terraform에 의해 overlays/dev/targetgroupbinding-patch.yaml 에서 자동으로 덮어씌워집니다.
  # 임시 플레이스홀더 값만 유지합니다.
  targetGroupARN: "arn:aws:elasticloadbalancing:ap-northeast-2:000000000000:targetgroup/placeholder/00000000"
  
  serviceRef:
    name: train-backend-service
    port: 8080              