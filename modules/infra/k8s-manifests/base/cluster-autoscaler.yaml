# ==============================================================================
# Cluster Autoscaler 설치 방법
# ==============================================================================
# ⚠️  이 파일을 kubectl로 직접 적용하지 마세요.
#     Cluster Autoscaler는 RBAC, ServiceAccount, IRSA 권한이 모두 필요하며
#     Helm을 통해 설치하는 것이 표준 방식입니다.
#
# [설치 방법] EKS 클러스터 생성 후 아래 명령어를 실행하세요:
#
#   helm repo add autoscaler https://kubernetes.github.io/autoscaler
#   helm repo update
#
#   helm install cluster-autoscaler autoscaler/cluster-autoscaler \
#     --namespace kube-system \
#     --set autoDiscovery.clusterName=team-train-dev-eks \
#     --set awsRegion=ap-northeast-2 \
#     --set rbac.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<IRSA_ROLE_ARN>
#
# [IRSA 역할 ARN]
#   terraform output 또는 EKS 콘솔에서 cluster-autoscaler용 IRSA ARN을 확인하세요.
#   eks-cluster 모듈에 해당 IAM Role이 생성되어 있어야 합니다.
#
# ==============================================================================
