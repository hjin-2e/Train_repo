# 백엔드 API 배포 및 서비스
apiVersion: apps/v1
kind: Deployment
metadata:
  name: train-backend
  namespace: default
  labels:
    app: train-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: train-backend
  template:
    metadata:
      labels:
        app: train-backend
    spec:
      containers:
      - name: backend-container
        image: team-train-dev-backend
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: train-config
        - secretRef:
            name: train-secret
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"