apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: train-external-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: train-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: team-train-db-secret
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: team-train-db-secret
        property: DB_PASSWORD