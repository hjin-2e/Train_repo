# 백엔드 자동 확장(HPA) 규칙, 자동 오토스케일러
# Redis 읽기 → SQS 전송 백엔드 스케일링
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: train-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: train-backend # 앞부분 API 배포 이름
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # CPU 사용률 60% 초과 시 스케일아웃
        averageUtilization: 60 