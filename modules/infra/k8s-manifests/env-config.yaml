# EKS 런타임 환경변수 주입 설정 (ConfigMap & Secret)

apiVersion: v1
kind: ConfigMap
metadata:
  name: train-config
  namespace: default
data:
  # 기본 및 네트워킹 설정
  PORT: "8080"
  ALLOWED_ORIGINS: "http://api.team-train.cloud"

  # AWS 인프라 리전 및 SQS 정보
  AWS_REGION: "ap-northeast-2"
  SQS_QUEUE_URL: "AWS_SQS_Queue_URL_입력"

  # 데이터베이스 연결 정보 (Aurora MySQL)
  DB_HOST: "Aurora_Cluster_Endpoint_입력"
  DB_PORT: "3306"
  DB_NAME: "trail_db"

  # 캐시 및 인메모리 DB 연결 정보 (ElastiCache Redis)
  REDIS_HOST: "ElastiCache_Redis_Configuration_Endpoint_입력"
  REDIS_PORT: "6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: train-secret
  namespace: default
type: Opaque
stringData:
  # 데이터베이스 계정 및 패스워드 (terraform.tfvars의 db_admin_user/password와 일치해야 함)
  DB_USER: "admin"
  DB_PASSWORD: "adminpassword123"
