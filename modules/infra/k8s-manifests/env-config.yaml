# EKS 런타임 환경변수 주입 설정 (ConfigMap & Secret)

apiVersion: v1
kind: ConfigMap
metadata:
  name: train-config
  namespace: default
data:
  # 기본 및 네트워킹 설정
  PORT: "8080"
  ALLOWED_ORIGINS: "https://team-train.cloud,https://www.team-train.cloud"

  # AWS 인프라 리전 및 SQS 정보
  AWS_REGION: "ap-northeast-2"
  SQS_QUEUE_URL: "AWS_SQS_Queue_URL_입력"
  MAIL_QUEUE_URL: "AWS_MAIL_Queue_URL_입력"

  # 데이터베이스 연결 정보 (Aurora MySQL)
  DB_HOST: "Aurora_Cluster_Endpoint_입력"
  DB_PORT: "3306"
  DB_NAME: "trail_db"

  # 캐시 및 인메모리 DB 연결 정보 (ElastiCache Redis)
  REDIS_HOST: "ElastiCache_Redis_Configuration_Endpoint_입력"
  REDIS_PORT: "6379"

# DB_USER, DB_PASSWORD는 ESO(External Secrets Operator) 설치 후
# AWS Secrets Manager에서 자동으로 K8s Secret(train-secret)을 생성함
# secret-store.yaml 참고해주세요
