# [MODIFY] modules/infra/k8s-manifests/ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: train-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # 1. 80(HTTP) 및 443(HTTPS) 포트 활성화
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    
    # 2. HTTP 요청이 들어오면 HTTPS로 자동 강제 리다이렉트
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # 3. 테라폼이 생성한 ALB 전용 ACM SSL 인증서 ARN 주입
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:YOUR_ACCOUNT_ID:certificate/YOUR_ACM_ID"
    
    # 4. 네트워크 담당자가 설계한 ALB 전용 보안 그룹 연동
    alb.ingress.kubernetes.io/security-groups: "sg-xxxxxxxxxxxx"

spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix 
        backend:
          service:
            name: train-backend-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: train-frontend-service
            port:
              number: 80