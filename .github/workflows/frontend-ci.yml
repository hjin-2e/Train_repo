# ==============================================================================
# Frontend CI/CD Workflow
# ==============================================================================
# [CI]  GitHub Actions: Lint → Test → Build → S3 아티팩트 업로드
# [CD]  AWS CodePipeline이 S3 변경을 감지 → CodeBuild가 배포 자동 실행
# ==============================================================================

name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      # ⚠️ 프론트엔드 코드 경로에 맞게 수정하세요
      # 레포 루트에 있는 경우: '**/*.tsx', '**/*.ts', 'package.json' 등으로 변경
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'buildspec.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

# OIDC 토큰 발급을 위해 필수
permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # CI Job: Lint + Test + Build (모든 push/PR에서 실행)
  # ============================================================
  ci:
    name: Lint / Test / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        # ⚠️ 프론트엔드 소스가 있는 디렉토리로 변경하세요
        # 레포 루트인 경우: working-directory: .
        working-directory: ./frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # ⚠️ 경로에 맞게 수정하세요
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        # ESLint가 없으면 아래로 교체
        # run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          # Create React App / Vite 공통 환경변수
          NODE_ENV: production

      # ============================================================
      # CD 준비: main 브랜치 push 시에만 S3로 아티팩트 업로드
      # ============================================================
      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # GitHub Repository Secrets에 등록 필요:
          #   AWS_GITHUB_ACTIONS_ROLE_ARN = Terraform output의 github_actions_role_arn
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-northeast-2
          # ------------------------------------------------------
          # [대안] OIDC 대신 IAM Access Key를 사용하려면 아래 주석 해제
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # role-to-assume 줄은 삭제하세요.
          # ------------------------------------------------------

      - name: Package build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          # dist/ 내용물 + buildspec.yml을 하나의 ZIP으로 패키징
          # CodeBuild에서 ZIP 해제 시 dist 파일들이 루트에 위치하게 됩니다.
          mkdir -p deploy_package
          # ⚠️ 빌드 결과물 경로 확인: CRA → frontend/build, Vite → frontend/dist
          cp -r frontend/dist/. deploy_package/
          cp buildspec.yml deploy_package/
          cd deploy_package
          zip -r ../deployment.zip .
          echo "📦 Artifact size: $(du -sh ../deployment.zip | cut -f1)"

      - name: Upload artifact to S3 (triggers CodePipeline)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          # GitHub Secrets에 등록 필요:
          #   ARTIFACT_BUCKET = Terraform output의 pipeline_artifact_bucket_name
          aws s3 cp deployment.zip \
            s3://${{ secrets.ARTIFACT_BUCKET }}/frontend/deployment.zip \
            --region ap-northeast-2
          echo "✅ Artifact uploaded. CodePipeline will start automatically."

  # ============================================================
  # Build 결과 요약 (PR 코멘트용 — 선택사항)
  # ============================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: ci
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.ci.result }}" = "success" ]; then
            echo "✅ CI passed. Deployment triggered (if push to main)."
          else
            echo "❌ CI failed. Deployment skipped."
            exit 1
          fi
